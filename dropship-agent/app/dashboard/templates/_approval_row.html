<tr id="approval-{{ r.id }}">
  <td>{{ r.id }}</td>
  <td>{{ r.action_type.value.replace('_', ' ') }}</td>
  <td><strong>{{ r.title }}</strong>{% if r.description %}<br><small>{{ r.description }}</small>{% endif %}</td>
  <td>£{{ '%.2f'|format(r.estimated_cost_gbp) }}</td>
  <td><span class="status a-{{ r.status.value }}">{{ r.status.value }}</span></td>
  <td class="actions">
    {% if r.status.value == 'pending' %}
      <button class="approve" hx-post="/approvals/{{ r.id }}/approve" hx-target="#approval-{{ r.id }}" hx-swap="outerHTML"
              hx-confirm="Approve #{{ r.id }}: {{ r.title }}?">Approve</button>
      <button class="reject" hx-post="/approvals/{{ r.id }}/reject" hx-target="#approval-{{ r.id }}" hx-swap="outerHTML">Reject</button>
    {% endif %}
  </td>
</tr>
