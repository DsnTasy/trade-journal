# Dropship Agent settings. Safe to commit: NO secrets here (they go in .env).

# SAFETY SWITCH. true = nothing real happens (no publishing, emails, orders, ad spend).
# Only set to false when you're ready, and approvals are still required either way.
dry_run: true

database_url: "sqlite:///data/dropship.db"
log_file: "logs/app.log"
llm_cache_dir: "data/llm_cache"
http_cache_dir: "data/http_cache"

budget:
  monthly_cap_gbp: 25.00        # Hard cap for ALL paid API calls per calendar month.
  warn_at_fraction: 0.8         # Warn at 80% of the cap.
  approval_threshold_gbp: 1.00  # A single call estimated above this needs your approval.

llm:
  default_model: "claude-opus-5-5"
  # Optional per-task cheaper models, e.g.:
  # task_models:
  #   scoring: "claude-haiku-5-5"
  task_models: {}
  effort: "medium"              # low | medium | high. Higher = better but more expensive.
  max_tokens: 4000
  usd_to_gbp: 0.79              # Assumption: update occasionally. Anthropic bills in USD.
  # Prices in USD per million tokens (checked November 2026). Check anthropic.com/pricing occasionally
  # and update. Unknown models are refused rather than guessed.
  prices:
    claude-opus-5-5:   {input_usd_per_mtok: 4.00, output_usd_per_mtok: 20.00, cache_read_usd_per_mtok: 0.20, cache_write_usd_per_mtok: 5.00}
    claude-sonnet-5-5: {input_usd_per_mtok: 2.00, output_usd_per_mtok: 10.00, cache_read_usd_per_mtok: 0.10, cache_write_usd_per_mtok: 2.50}
    claude-haiku-5-5:  {input_usd_per_mtok: 0.10, output_usd_per_mtok: 0.50, cache_read_usd_per_mtok: 0.01, cache_write_usd_per_mtok: 0.125}
    claude-opus-5:     {input_usd_per_mtok: 5.00, output_usd_per_mtok: 25.00, cache_read_usd_per_mtok: 0.50, cache_write_usd_per_mtok: 6.25}

business:
  currency: "GBP"
  vat_registered: false
  vat_rate: 0.20
  vat_registration_threshold_gbp: 90000
  usd_to_gbp: 0.79              # exchange-rate assumptions for supplier prices in USD / EUR
  eur_to_gbp: 0.85

store:
  platform: "shopify"
  shop: ""                      # your store's subdomain: "my-store" for my-store.myshopify.com
  api_version: "2026-10"        # Shopify Admin API version
  publication_name: "Online Store"  # the sales channel products are published to
  track_inventory: false        # dropshipping: the supplier holds stock
  timeout_seconds: 30

research:
  candidates_file: "research/candidates.csv"   # your list of product ideas (see research/README.md)
  trends_dir: "research/trends"                # put Google Trends CSV exports here
  # How much each factor counts towards the 0-100 score (they're rebalanced if data is missing).
  weights: {demand: 0.30, trend: 0.20, margin: 0.30, competition: 0.20}
  target_gross_margin: 0.60     # a rough margin of 60%+ scores full marks for margin
  competition_high: 50          # 50+ competitor stores = maximum competition
  saturation_high: 30           # 30+ advertisers running it = maximum saturation penalty
  saturation_max_penalty: 25    # saturation can remove up to 25 points
  seasonal_ratio: 2.5           # peak interest 2.5x the average = "seasonal"
  seasonal_penalty: 5
  low_confidence_below: 0.5     # flag scores based on less than half the data
  # Categories you don't want to sell yet. Matching products are marked as excluded.
  avoid_categories: ["cosmetics", "toys", "electrical", "supplements"]
  # Meta Ad Library API (optional). Needs META_AD_LIBRARY_TOKEN in .env. For non-political
  # ads it only covers ads shown in the EU, so we use EU countries as a stand-in for the UK.
  meta_enabled: false
  meta_api_version: "v21.0"
  meta_countries: ["IE", "FR", "DE"]
  meta_max_pages: 3
  request_delay_seconds: 1.0

profit:
  # Default assumptions. CHECK THESE against your own Shopify plan; edit per product in the dashboard.
  payment_fee_pct: 2.0          # Shopify Payments card fee % (UK cards; depends on your plan)
  payment_fee_fixed_gbp: 0.25   # ...plus this per order
  third_party_gateway_fee_pct: 0.0  # only if you DON'T use Shopify Payments
  platform_monthly_fee_gbp: 25  # Shopify plan + paid apps per month
  expected_orders_per_month: 50 # spreads the monthly fee across orders
  packaging_gbp: 0.0            # extra packaging/inserts per order, if any
  refund_rate: 0.05             # 5% of orders refunded (money back, goods usually not recovered)
  chargeback_rate: 0.005        # 0.5% of orders disputed
  chargeback_fee_gbp: 15        # fee per chargeback
  cpa_gbp: 10                   # ad cost per sale: your biggest unknown, test and update it
  go_min_profit_gbp: 5          # "go" needs at least £5 profit per sale after ads...
  go_min_margin: 0.15           # ...and a 15% margin after ads
  max_comfortable_roas: 3.0     # break-even ROAS above 3 = hard to make money with ads

suppliers:
  suppliers_file: "research/suppliers.csv"
  weights: {price: 0.30, delivery: 0.25, warehouse: 0.15, reliability: 0.15, terms: 0.15}
  target_delivery_days: 7       # UK delivery within 7 days scores well
  slow_shipping_days: 15        # 15+ days gets a red flag
  red_flag_penalty: 5           # points removed per red flag
  top_n: 3                      # how many suppliers to show per product

competitors:
  # Research only: we check robots.txt and their terms first, and stop if automated access is forbidden.
  user_agent: "dropship-agent-research/0.4 (personal market research; low volume; respects robots.txt)"
  request_delay_seconds: 3      # wait between requests to the same site
  cache_hours: 24               # re-use downloaded pages for a day instead of asking again
  max_product_pages: 4          # read at most 4 x 250 products
  timeout_seconds: 20

video:
  ffmpeg_path: "ffmpeg"         # if ffmpeg isn't on your PATH, put the full path here
  ffprobe_path: "ffprobe"
  media_dir: "media"            # your footage: media/<product-name>/   music: media/music/
  output_dir: "output/videos"
  width: 1080                   # 9:16 vertical for TikTok, Reels and Shorts
  height: 1920
  fps: 30
  max_shot_seconds: 4           # cut to a new shot at least every 4 seconds
  end_card_seconds: 2.5
  brand_colour: "#1d2330"       # end card background
  text_colour: "#ffffff"
  font: "DejaVu Sans"           # any font installed on your computer (e.g. "Arial")
  caption_size: 72
  music_volume: 0.15            # background music level (0-1)
  voice_provider: "none"        # none = captions only; recorded = your own voiceover file
  paid_approval_threshold_gbp: 0.50  # paid AI voice/video calls above this need approval
